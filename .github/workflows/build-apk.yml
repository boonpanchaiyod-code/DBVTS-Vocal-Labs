name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies and add Android
        run: |
          mkdir -p www
          if [ -f "DBVTS_Vocal_Lab_App.html" ]; then
            cp DBVTS_Vocal_Lab_App.html www/index.html
          else
            echo "<h1>DBVTS Vocal Lab</h1>" > www/index.html
          fi
          npm install
          npx cap add android

      - name: Grant microphone permission
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "RECORD_AUDIO" "$MANIFEST"; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />' "$MANIFEST"
          fi

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbvts-vocal-lab-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
